<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>铝板台面检查 · 无需纸十字</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#edf3f5;font:16px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:20px}h1{font-size:26px;margin:0}.muted{color:#b2c2ce}.panel{background:#1c2a36;border:1px solid #344857;border-radius:10px;padding:16px;margin:14px 0}#step{color:#89edcd;font-size:20px;font-weight:600}#table{display:block;width:min(100%,calc(56vh * 16 / 9));height:auto;cursor:crosshair}button{font:inherit;background:#d8eee6;color:#102b23;border:1px solid #7b8e9b;border-radius:5px;padding:8px 14px;margin:6px 6px 0 0;cursor:pointer}button:disabled{opacity:.4;cursor:default}label{display:block;margin:12px 0}.magnifier{position:fixed;right:14px;bottom:12px;pointer-events:none;padding:10px;font-size:13px}#loupe{display:block;width:140px;height:140px;border:1px solid #89edcd}#result{white-space:pre-wrap;overflow-wrap:anywhere}.warning{color:#ffcf89}@media(max-width:700px){.magnifier{position:static}}
</style>
<main><h1>铝板台面检查 · 无需纸十字</h1><p class="muted">五次摆板已采集。最后只点 8 个胶边点，不输入毫米坐标。<br>本轮检查局部尺寸，不启用正式标定，不代表全链路通过。</p>
<section class="panel"><div id="step">正在加载原图…</div><p>按 <b>下 → 右 → 上 → 左</b> 顺序，每边点两次胶边最靠台面的鼻尖直线。两点尽量分开，避开袋口弧线、木框和阴影。<br>确认整桌和六个袋口可见；当前图是第一次中央摆板时的原图。</p>
<canvas id="table" width="1920" height="1080" aria-label="中央摆板时的全桌原图"></canvas><button id="undo" disabled>撤销上一个点</button><button id="reset" disabled>重选全部点</button></section>
<section class="panel"><label><input type="checkbox" id="confirmed"> 我确认这是本次 RER 相机，五次采集机位/焦距未变；有效内沿 2540 × 1270 mm；铝板每次都平放，未手持倾斜。</label>
<p class="warning">板子格距固定为 25 mm。板上角点只检验距离，不用于调整台面变换。厚度、翘起和人工点边误差仍需审阅。</p>
<button id="save" disabled>计算格距并保存回传结果</button><button id="cancel">取消并保留已有证据</button></section>
<section class="panel magnifier">原图局部放大<br>红线交点为点击位置<canvas id="loupe" width="240" height="240"></canvas></section>
<section class="panel" id="result" role="status">等待点选。没有纸十字或实测坐标输入步骤。</section></main>
<script>
'use strict';
const canvas=document.querySelector('#table'),ctx=canvas.getContext('2d'),loupe=document.querySelector('#loupe').getContext('2d'),img=new Image(),points=[];
const steps=['下胶边：第 1 点','下胶边：第 2 点','右胶边：第 1 点','右胶边：第 2 点','上胶边：第 1 点','上胶边：第 2 点','左胶边：第 1 点','左胶边：第 2 点'];let loaded=false,busy=false,finished=false;
function update(){document.querySelector('#step').textContent=finished?'本次检查已结束':!loaded?'正在加载原图…':points.length<8?`${points.length+1} / 8 · ${steps[points.length]}`:'8 / 8 · 已点完，核对后勾选确认并保存';document.querySelector('#save').disabled=busy||finished||points.length!==8||!document.querySelector('#confirmed').checked;for(const id of ['undo','reset'])document.querySelector('#'+id).disabled=busy||finished||!points.length;if(!loaded)return;ctx.drawImage(img,0,0);points.forEach(([x,y],i)=>{ctx.strokeStyle='#ffce7d';ctx.fillStyle='#ffce7d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,6,0,2*Math.PI);ctx.stroke();ctx.font='bold 22px sans-serif';ctx.fillText(String(i+1),x+10,y-10);if(i%2){ctx.beginPath();ctx.moveTo(...points[i-1]);ctx.lineTo(x,y);ctx.stroke()}})}
function position(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*1920/r.width,(e.clientY-r.top)*1080/r.height]}
canvas.onclick=e=>{if(!loaded||busy||finished||points.length===8)return;const p=position(e);if(p[0]>=0&&p[0]<1920&&p[1]>=0&&p[1]<1080){points.push(p);update()}};
canvas.onmousemove=e=>{if(!loaded)return;const [x,y]=position(e);loupe.fillStyle='#000';loupe.fillRect(0,0,240,240);loupe.imageSmoothingEnabled=false;loupe.drawImage(img,x-40,y-40,80,80,0,0,240,240);loupe.strokeStyle='#f44';loupe.beginPath();loupe.moveTo(120,0);loupe.lineTo(120,240);loupe.moveTo(0,120);loupe.lineTo(240,120);loupe.stroke()};
document.querySelector('#undo').onclick=()=>{points.pop();update()};document.querySelector('#reset').onclick=()=>{points.length=0;update()};document.querySelector('#confirmed').onchange=update;
async function post(route,payload){const response=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const r=await response.json();if(!response.ok)throw new Error(r.error||'请求失败');return r}
document.querySelector('#save').onclick=async()=>{busy=true;update();try{const r=await post('save',{rails_px:points,confirmed:document.querySelector('#confirmed').checked});finished=true;document.querySelector('#cancel').disabled=true;const names=['中央','左下','右下','左上','右上'];document.querySelector('#result').textContent=(r.coverage==='FIVE_REGIONS_COLLECTED'?'五个区域已覆盖，尺寸结果待审阅。':'摆板区域覆盖不足，请把结果发回审阅。')+'\n'+r.boards.map((b,i)=>`${names[i]}：平均格距 ${b.mean_cell_mm.toFixed(2)} mm（标称25）；长跨度 ${b.long_span_mean_mm.toFixed(2)} mm（标称250）；短跨度 ${b.short_span_mean_mm.toFixed(2)} mm（标称175）；最大点对距离误差 ${b.max_pair_distance_error_mm.toFixed(2)} mm`).join('\n')+'\n已保存。返回 PowerShell，等待 SEND BACK 路径，把 ZIP 发回。\n本轮没有验证整桌绝对坐标，也没有启用正式标定。'}catch(e){document.querySelector('#result').textContent='未完成保存：'+e.message+'。请检查点选或回传 PowerShell 日志。'}finally{busy=false;update()}};
document.querySelector('#cancel').onclick=async()=>{if(busy||finished)return;busy=true;update();try{await post('cancel',{});finished=true;document.querySelector('#cancel').disabled=true;document.querySelector('#result').textContent='已取消。回到 PowerShell 查看 SEND BACK ZIP；已有采集证据仍保留。'}catch(e){document.querySelector('#result').textContent=e.message}finally{busy=false;update()}};
img.onload=()=>{loaded=true;update()};img.onerror=()=>{document.querySelector('#step').textContent='原图加载失败，请查看 PowerShell，不要继续点选'};img.src='frame.png';update();
</script></html>
